services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: routewise-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routewise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-routewise}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - routewise-network
    restart: unless-stopped
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-routewise} -d ${POSTGRES_DB:-routewise}' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  osrm:
    image: osrm/osrm-backend:latest
    container_name: routewise-osrm
    command: osrm-routed --algorithm mld /data/mexico-latest.osrm
    volumes:
      - ./docker/osrm/data:/data
    networks:
      - routewise-network
    restart: unless-stopped
    healthcheck:
      test: [ 'CMD-SHELL', 'bash -c "</dev/tcp/127.0.0.1/5000"' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: routewise-api
    depends_on:
      postgres:
        condition: service_healthy
      osrm:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - routewise-network
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-routewise}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-routewise}
      - ROUTING_PROVIDER=osrm
      - OSRM_URL=http://osrm:5000
    restart: unless-stopped

networks:
  routewise-network:
    driver: bridge

volumes:
  postgres_data:

web:
  build:
    context: .
    dockerfile: apps/mobile/Dockerfile
  image: routewise-web:latest
  container_name: routewise-web
  networks:
    - routewise-network
  restart: unless-stopped